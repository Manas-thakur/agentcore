<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentCore Traces</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f6fdb; --ok: #2f9e44; --err: #c92a2a; --bar-model: #5b8def; --bar-tool: #e8a33d;
    --bar-other: #9aa0a6; --bar-graph: #7b61d1; --code: #f1f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9b9a94; --line: #2e2d2a;
      --accent: #7aa7ff; --ok: #69db7c; --err: #ff8787; --code: #262522;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .trace { padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .trace:hover { background: var(--code); }
  .trace.active { border-color: var(--accent); }
  .trace .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
  .dot.error { background: var(--err); }
  .row { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 8px; align-items: center;
         padding: 3px 0; cursor: pointer; }
  .row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .track { position: relative; height: 16px; background: var(--code); border-radius: 3px; }
  .bar { position: absolute; top: 2px; height: 12px; border-radius: 2px; min-width: 2px; background: var(--bar-other); }
  .bar.model { background: var(--bar-model); } .bar.tool { background: var(--bar-tool); }
  .bar.graph { background: var(--bar-graph); } .bar.error { outline: 2px solid var(--err); }
  pre { background: var(--code); padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 320px; margin: 6px 0 0; }
  .empty { color: var(--muted); padding: 16px 4px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 160px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent);
           color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .answer { margin: 0 0 12px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--code);
            border-radius: 0 6px 6px 0; white-space: pre-wrap; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 4px 0 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>AgentCore</h1><span>local trace dashboard</span><span id="health"></span>
</header>
<main>
  <section>
    <h2>Recent traces</h2>
    <div id="traces"><div class="empty">Loading...</div></div>
  </section>
  <section>
    <h2>Try the agent</h2>
    <form id="ask">
      <input type="text" id="question" placeholder="e.g. What is 17 * 23 + 4?" autocomplete="off">
      <button id="go" type="submit">Run</button>
    </form>
    <div id="answer"></div>
    <h2>Trace detail</h2>
    <div class="legend">
      <span><i style="background:var(--bar-model)"></i>model</span>
      <span><i style="background:var(--bar-tool)"></i>tool</span>
      <span><i style="background:var(--bar-graph)"></i>graph</span>
      <span><i style="background:var(--bar-other)"></i>other</span>
    </div>
    <div id="detail"><div class="empty">Select a trace.</div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selected = null;

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

function kind(name) {
  if (name.startsWith("model.")) return "model";
  if (name.startsWith("tool.")) return "tool";
  if (name.startsWith("graph.")) return "graph";
  return "";
}

async function loadTraces() {
  try {
    const traces = await getJSON("/api/traces?limit=50");
    if (!traces.length) { $("traces").innerHTML = '<div class="empty">No traces yet. Run an agent.</div>'; return; }
    $("traces").innerHTML = traces.map((t) => `
      <div class="trace ${t.trace_id === selected ? "active" : ""}" data-id="${t.trace_id}">
        <div class="name"><span class="dot ${t.status === "error" ? "error" : ""}"></span>${esc(t.name)}</div>
        <div class="meta">
          <span>${new Date(t.start_time * 1000).toLocaleTimeString()}</span>
          <span>${t.duration_ms.toFixed(0)} ms</span><span>${t.span_count} spans</span>
          <span>${t.total_tokens} tok</span><span>$${t.cost_usd.toFixed(4)}</span>
        </div>
        <div class="meta">${esc((t.attributes.task || "").slice(0, 90))}</div>
      </div>`).join("");
    document.querySelectorAll(".trace").forEach((el) => el.onclick = () => showTrace(el.dataset.id));
  } catch (e) { $("traces").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function depthOf(span, byId) {
  let d = 0, p = span.parent_id;
  while (p && byId[p] && d < 20) { d++; p = byId[p].parent_id; }
  return d;
}

async function showTrace(id) {
  selected = id;
  document.querySelectorAll(".trace").forEach((el) => el.classList.toggle("active", el.dataset.id === id));
  const data = await getJSON(`/api/traces/${id}`);
  const spans = data.spans;
  if (!spans.length) { $("detail").innerHTML = '<div class="empty">Empty trace.</div>'; return; }
  const byId = Object.fromEntries(spans.map((s) => [s.span_id, s]));
  // depth-first order so children render under their parent
  const kids = {};
  spans.forEach((s) => { const p = byId[s.parent_id] ? s.parent_id : "root"; (kids[p] = kids[p] || []).push(s); });
  const ordered = [];
  const walk = (p) => (kids[p] || []).sort((a, b) => a.start_time - b.start_time).forEach((s) => { ordered.push(s); walk(s.span_id); });
  walk("root");
  const t0 = Math.min(...spans.map((s) => s.start_time));
  const t1 = Math.max(...spans.map((s) => s.end_time || s.start_time));
  const total = Math.max(t1 - t0, 1e-6);
  $("detail").innerHTML = `<div class="meta" style="margin-bottom:8px">trace ${esc(data.trace_id)} - ${(total * 1000).toFixed(1)} ms</div>` +
    ordered.map((s, i) => {
      const left = ((s.start_time - t0) / total) * 100;
      const width = Math.max(((s.end_time - s.start_time) / total) * 100, 0.4);
      const indent = depthOf(s, byId) * 12;
      return `<div class="row" data-i="${i}">
        <div class="label" style="padding-left:${indent}px" title="${esc(s.name)}">${esc(s.name)}</div>
        <div class="track"><div class="bar ${kind(s.name)} ${s.status === "error" ? "error" : ""}"
          style="left:${left}%;width:${width}%" title="${s.duration_ms.toFixed(1)} ms"></div></div>
      </div><pre id="attrs-${i}" hidden>${esc(JSON.stringify({duration_ms: s.duration_ms, status: s.status, error: s.error, attributes: s.attributes, events: s.events}, null, 2))}</pre>`;
    }).join("");
  document.querySelectorAll(".row").forEach((row) => row.onclick = () => {
    const pre = $(`attrs-${row.dataset.i}`); pre.hidden = !pre.hidden;
  });
}

$("ask").onsubmit = async (ev) => {
  ev.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  $("go").disabled = true;
  try {
    const r = await getJSON("/v1/agent", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({input: q})});
    $("answer").innerHTML = `<div class="answer">${esc(r.output)}</div>`;
    await loadTraces();
    if (r.trace_id) await showTrace(r.trace_id);
  } catch (e) { $("answer").innerHTML = `<div class="answer">${esc(e.message)}</div>`; }
  $("go").disabled = false;
};

getJSON("/health").then((h) => $("health").textContent = `model: ${h.model} - tools: ${h.tools.join(", ")}`).catch(() => {});
loadTraces();
setInterval(loadTraces, 5000);
</script>
</body>
</html>

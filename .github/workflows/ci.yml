name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web app (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build into src/agentcore/server/static
        run: pnpm build
      - name: Committed build is up to date
        working-directory: .
        run: |
          git status --porcelain src/agentcore/server/static
          git diff --exit-code src/agentcore/server/static
          test -z "$(git status --porcelain src/agentcore/server/static)" || {
            echo "::error::src/agentcore/server/static is out of date: run 'pnpm --dir web build' and commit the result"
            exit 1
          }

  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Eval suite (offline mock model)
        run: uv run agentcore eval --suite examples/evals/calculator_suite.yaml --model mock --markdown eval-report.md
      - name: Examples (offline)
        run: |
          uv run python examples/calculator_agent.py --model mock
          uv run python examples/rag_qa.py --model mock
          uv run python examples/workflow_graph.py
          uv run python examples/multi_agent.py --model mock
      - name: Scaffold smoke test (agentcore init)
        run: |
          uv run agentcore init "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          uv run --project "$GITHUB_WORKSPACE" python agent.py --model mock
          uv run --project "$GITHUB_WORKSPACE" agentcore eval --suite evals/basic.yaml --model mock
          uv run --project "$GITHUB_WORKSPACE" agentcore doctor --model mock
      - name: Build sdist + wheel
        if: matrix.python-version == '3.12'
        run: uv build
      - name: Eval summary
        if: always() && matrix.python-version == '3.12'
        run: test -f eval-report.md && cat eval-report.md >> "$GITHUB_STEP_SUMMARY" || true

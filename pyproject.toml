[project]
name = "agentcore"
version = "0.2.0"
description = "A from-scratch agentic AI platform: ReAct runtime, tools, eval, RAG, vector indexes, workflow graphs, multi-agent, observability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manas Thakur" }]
keywords = ["agents", "llm", "rag", "react", "hnsw", "bm25", "workflow", "ollama", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
pydantic = ["pydantic>=2.5"]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "pydantic>=2.5",
]

[project.scripts]
agentcore = "agentcore.cli:main"

[project.urls]
Homepage = "https://github.com/Manas-thakur/agentcore"
Repository = "https://github.com/Manas-thakur/agentcore"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["plans", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in defaults (dataclass field factories etc.)
    "SIM105", # contextlib.suppress is not always clearer
    "SIM108", # ternaries are not always clearer
    "UP007",  # keep Optional[...] where it reads better for schema examples
    "B905",   # zip() strictness is not needed for our internal pairings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402"]
